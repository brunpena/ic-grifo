# Deploy no Coolify: o banco e o Storage ficam no Supabase; configure as variáveis
# de ambiente no painel do Coolify (ver .env.example).
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_PGBOUNCER: ${DATABASE_PGBOUNCER:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-supabase}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-documents}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - api-data:/app/data
    expose:
      - "8000"

volumes:
  api-data:
